<text x="634" y="426" class="body" text-anchor="start" style="font-size: 22.6505px;">Repository ai_origin.txt</text>
<text x="634" y="460" class="body" text-anchor="start" style="font-size: 22.6505px;">or a saved candidate</text>
<text x="634" y="494" class="body" text-anchor="start" style="font-size: 22.6505px;">Versioned prompt text</text>
</g>
