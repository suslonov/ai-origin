<text x="194" y="861" class="body" text-anchor="start">Model + effort · dataset · sample selection strategy</text>
<text x="194" y="895" class="body" text-anchor="start">All / balanced % / manual; or exact-sample backtest</text>
<text x="194" y="929" class="body" text-anchor="start">Default model: gpt-6-luna</text>
</g>
