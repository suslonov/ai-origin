<text x="144" y="342" class="kind" text-anchor="start">«input»</text>
<text x="144" y="383" class="node-title" text-anchor="start">Collect &amp; label samples</text>
<text x="144" y="426" class="body" text-anchor="start" style="font-size: 21.0909px;">Text + language + manual estimate</text>
<text x="144" y="460" class="body" text-anchor="start" style="font-size: 21.0909px;">Acceptable probability range</text>
<text x="144" y="494" class="body" text-anchor="start" style="font-size: 21.0909px;">Known origin, notes, assignment</text>
<text x="144" y="528" class="body" text-anchor="start" style="font-size: 21.0909px;">Development / Holdout / Test</text>
<text x="144" y="562" class="body" text-anchor="start" style="font-size: 21.0909px;">Materials: use / unavailable / irrelevant</text>
<text x="144" y="596" class="body" text-anchor="start" style="font-size: 21.0909px;">Manual labels hidden from evaluator</text>
</g>
<g data-node-width="310"><rect x="610" y="310" width="310" height="260" rx="0" fill="#fff" stroke="#277c80" stroke-width="2.5"></rect>
<text x="634" y="342" class="kind" text-anchor="start">«input»</text>
