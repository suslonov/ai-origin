<path d="M1820,940 L1820,965 L1080,965 L1080,565 L1390,565" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="1110" y="545" class="edge-label" text-anchor="start">next sample</text>
<text x="1110" y="996" class="note" text-anchor="start">Save after each sample · stop after current call · preserve interrupted runs</text>
<g data-node-width="880"><rect x="2180" y="310" width="880" height="200" rx="0" fill="#fff" stroke="#376ca9" stroke-width="2.5"></rect>
<text x="2204" y="342" class="kind" text-anchor="start">«history»</text>
<text x="2204" y="383" class="node-title" text-anchor="start">Open any completed run</text>
<text x="2204" y="426" class="body" text-anchor="start">Immutable run history + exact prompt / sample snapshots</text>
<text x="2204" y="460" class="body" text-anchor="start">Review results or re-enter improvement with new guidance</text>
<text x="2204" y="494" class="body" text-anchor="start">Earlier runs and candidates remain available</text>
</g>
<path d="M1680,565 L2070,565 L2070,407 L2180,407" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="1740" y="547" class="edge-label" text-anchor="start">[no / stopped] finish</text>
<g data-node-width="880"><rect x="2180" y="595" width="880" height="310" rx="12" fill="#fff" stroke="#376ca9" stroke-width="2.5"></rect>
<text x="2204" y="627" class="kind" text-anchor="start">«action»</text>
<text x="2204" y="668" class="node-title" text-anchor="start">Inspect results &amp; compare</text>
<text x="2204" y="711" class="body" text-anchor="start">Sortable table: text · language · manual / model · difference</text>
<text x="2204" y="745" class="body" text-anchor="start">Difference histogram + MAE / RMSE / signed-bias trends</text>
<text x="2204" y="779" class="body" text-anchor="start">Agreement metrics + known-origin classification metrics</text>
<text x="2204" y="813" class="body" text-anchor="start">Filter by dataset · read explanations · export CSV</text>
<text x="2204" y="847" class="body" text-anchor="start">Paired backtests compare the same saved samples</text>
</g>
<path d="M2620,510 L2620,595" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M2620,905 L2620,1055 L690,1055 L690,1230" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="1180" y="1040" class="edge-label" text-anchor="start">select source run → new improvement attempt</text>
<g data-node-width="1080"><rect x="150" y="1230" width="1080" height="210" rx="12" fill="#fff" stroke="#ab6725" stroke-width="2.5"></rect>
<text x="174" y="1262" class="kind" text-anchor="start">«action»</text>
<text x="174" y="1303" class="node-title" text-anchor="start">Set improvement objective</text>
<text x="174" y="1346" class="body" text-anchor="start">New candidate name + HIGH-PRIORITY REVIEWER GUIDANCE</text>
<text x="174" y="1380" class="body" text-anchor="start">Scope: Development only, or all successful samples from the run</text>
<text x="174" y="1414" class="body" text-anchor="start">Including Test / Holdout makes them optimization evidence</text>
</g>
<path d="M525,1570 L660,1495 L795,1570 L660,1645 Z" fill="white" stroke="#376ca9" stroke-width="2.5"></path>
