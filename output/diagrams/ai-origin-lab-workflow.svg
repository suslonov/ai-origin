<text x="2654" y="1562" class="kind" text-anchor="start">«action»</text>
<text x="2654" y="1603" class="node-title" text-anchor="start">Import output once</text>
<text x="2654" y="1646" class="body" text-anchor="start">Load output / open version / run</text>
<text x="2654" y="1680" class="body" text-anchor="start">Require valid, nonempty text</text>
<text x="2654" y="1714" class="body" text-anchor="start">Freeze JSON + hash + parent</text>
<text x="2654" y="1748" class="body" text-anchor="start">Empty file stays pending</text>
</g>
<path d="M2850,1440 L2850,1530" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
