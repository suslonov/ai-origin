<text x="2654" y="1303" class="node-title" text-anchor="start">Register candidate</text>
<text x="2654" y="1346" class="body" text-anchor="start">Create candidate metadata</text>
<text x="2654" y="1380" class="body" text-anchor="start">Prepare empty output TXT</text>
<text x="2654" y="1414" class="body" text-anchor="start">Status: awaiting_external</text>
</g>
