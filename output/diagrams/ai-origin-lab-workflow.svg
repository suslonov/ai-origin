<text x="660" y="1596" class="body" text-anchor="middle">route?</text>
<path d="M660,1440 L660,1495" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<g data-node-width="510"><rect x="150" y="1760" width="510" height="210" rx="12" fill="#fff" stroke="#ab6725" stroke-width="2.5"></rect>
<text x="174" y="1792" class="kind" text-anchor="start">«action»</text>
<text x="174" y="1833" class="node-title" text-anchor="start" style="font-size: 27.5839px;">Generate through OpenAI API</text>
<text x="174" y="1876" class="body" text-anchor="start" style="font-size: 23.862px;">Choose improvement model + effort</text>
<text x="174" y="1910" class="body" text-anchor="start" style="font-size: 23.862px;">LangGraph: prepare → propose → save</text>
<text x="174" y="1944" class="body" text-anchor="start" style="font-size: 23.862px;">Guidance takes priority over heuristics</text>
</g>
<path d="M660,1645 L660,1700 L405,1700 L405,1760" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="440" y="1690" class="edge-label" text-anchor="start">[API]</text>
<text x="730" y="1800" class="note" text-anchor="start">Every attempt is independent.</text>
<text x="730" y="1840" class="note" text-anchor="start">Use new guidance to explore</text>
<text x="730" y="1877" class="note" text-anchor="start">another prompt revision.</text>
<text x="150" y="2055" class="note" text-anchor="start">Output: complete replacement prompt + rationale</text>
<g data-node-width="1020"><rect x="1410" y="1230" width="1020" height="250" rx="0" fill="#fff" stroke="#7553a3" stroke-width="2.5"></rect>
<text x="1434" y="1262" class="kind" text-anchor="start">«files»</text>
<text x="1434" y="1303" class="node-title" text-anchor="start">Prepare coder handoff · no model call</text>
<text x="1434" y="1346" class="body" text-anchor="start">handoffs/&lt;improvement-id&gt;/instructions.md</text>
<text x="1434" y="1380" class="body" text-anchor="start">Frozen parent-prompt.txt + evidence.json + sample JSON files</text>
<text x="1434" y="1414" class="body" text-anchor="start">Instructions include every input path and the exact output path</text>
<text x="1434" y="1448" class="body" text-anchor="start">High-priority guidance + required output contract</text>
</g>
<path d="M795,1570 L1330,1570 L1330,1360 L1410,1360" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="895" y="1555" class="edge-label" text-anchor="start">[Claude Code / Codex]</text>
<g data-node-width="1020"><rect x="1410" y="1570" width="1020" height="180" rx="12" fill="#fff" stroke="#7553a3" stroke-width="2.5"></rect>
<text x="1434" y="1602" class="kind" text-anchor="start">«action»</text>
<text x="1434" y="1643" class="node-title" text-anchor="start">User gives the short prompt to the coder</text>
<text x="1434" y="1686" class="body" text-anchor="start">“Read &lt;instructions.md&gt; and write the complete prompt to &lt;output.txt&gt;.”</text>
<text x="1434" y="1720" class="body" text-anchor="start">Claude Code / Codex reads the bundle and authors the new prompt</text>
</g>
<path d="M1920,1480 L1920,1570" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="1945" y="1522" class="edge-label" text-anchor="start">manual handoff</text>
<g data-node-width="1020"><rect x="1410" y="1830" width="1020" height="160" rx="0" fill="#fff" stroke="#7553a3" stroke-width="2.5"></rect>
<text x="1434" y="1862" class="kind" text-anchor="start">«file»</text>
<text x="1434" y="1903" class="node-title" text-anchor="start">Coder fills the registered output TXT</text>
<text x="1434" y="1946" class="body" text-anchor="start">Complete UTF-8 prompt · no JSON wrapper or code fences</text>
<text x="1434" y="1980" class="body" text-anchor="start">Write atomically; leave samples and repository files unchanged</text>
</g>
<path d="M1920,1750 L1920,1830" fill="none" stroke="#33465d" stroke-width="3" marker-end="url(#arrow)"></path>
