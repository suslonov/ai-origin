<text x="1129" y="762" class="kind" text-anchor="start">«action»</text>
<text x="1129" y="803" class="node-title" text-anchor="start">Evaluate one sample</text>
<text x="1129" y="846" class="body" text-anchor="start">OpenAI model + selected prompt</text>
<text x="1129" y="880" class="body" text-anchor="start">Apply language &amp; materials mode</text>
<text x="1129" y="914" class="body" text-anchor="start">Receive probability + explanation</text>
</g>
<g data-node-width="300"><rect x="1670" y="730" width="300" height="210" rx="12" fill="#fff" stroke="#376ca9" stroke-width="2.5"></rect>
<text x="1694" y="762" class="kind" text-anchor="start">«action»</text>
<text x="1694" y="803" class="node-title" text-anchor="start">Validate &amp; save</text>
<text x="1694" y="846" class="body" text-anchor="start">Result or error</text>
<text x="1694" y="880" class="body" text-anchor="start">Usage + timing</text>
<text x="1694" y="914" class="body" text-anchor="start">Update metrics</text>
</g>
