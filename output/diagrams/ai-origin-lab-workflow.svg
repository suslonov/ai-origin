<text x="2654" y="1996" class="body" text-anchor="start">Inspect changes from parent</text>
<text x="2654" y="2030" class="body" text-anchor="start">Select for the next evaluation</text>
<text x="2654" y="2064" class="body" text-anchor="start">Or run a paired backtest</text>
