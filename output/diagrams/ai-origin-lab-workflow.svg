<text x="1134" y="337" class="kind" text-anchor="start">«snapshot»</text>
<text x="1134" y="378" class="node-title" text-anchor="start">Create run &amp; freeze inputs</text>
<text x="1134" y="421" class="body" text-anchor="start">Save prompt, sample revisions, settings and random seed</text>
<text x="1134" y="455" class="body" text-anchor="start">Queue background job; keep the dashboard responsive</text>
</g>
